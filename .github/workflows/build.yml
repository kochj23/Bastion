name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Select Xcode 16
      # The runner can default to Xcode 15, whose Swift can't compile the pinned
      # mlx-swift-lm (MLXLMCommon) and which lacks `-downloadComponent`. Pin to 16.
      run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"

    - name: Install Metal Toolchain
      # The MLX dependency compiles Metal shaders; Xcode 16 no longer bundles the
      # Metal Toolchain by default, so the build fails without this.
      run: xcodebuild -downloadComponent MetalToolchain || true

    - name: Build & Test
      run: |
        XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
        if [ -z "$XCODEPROJ" ]; then echo "No Xcode project found"; exit 1; fi
        SCHEME=Bastion
        echo "Testing scheme: $SCHEME"
        set -o pipefail
        xcodebuild test \
          -project "$XCODEPROJ" \
          -scheme "$SCHEME" \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -60
